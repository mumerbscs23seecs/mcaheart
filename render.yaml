services:
  - type: web
    name: mca-heart-site
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node ./dist/server/entry.mjs
    envVars:
      # @supabase/supabase-js needs Node's native WebSocket (its realtime
      # client constructor throws without it, crashing every pipeline-
      # touching page) - that only exists from Node 22 onward.
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # Supabase (pipeline backend) - set the real values in the Render dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Email - everything is sent from researchlab@mcaheart.com over SMTP
      # (ZeptoMail or Zoho Mail; see src/lib/email.ts).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Where form submissions are delivered
      - key: CONTACT_TO
        sync: false
      - key: IDEAS_TO
        sync: false
      - key: RECRUIT_TO
        sync: false
      - key: DEFAULT_MEMBER_PASSWORD
        sync: false
      - key: COORDINATOR_EMAILS
        sync: false
      - key: ALWAYS_BCC
        sync: false
